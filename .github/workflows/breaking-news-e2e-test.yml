name: Breaking News E2E Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Send simulated urgent alert through production path
        env:
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
          TEST_MODE: "1"
        run: node scripts/monitor-news.mjs

      - name: Save test history
        run: |
          if git diff --quiet -- data/breaking-news-state.json; then
            echo "No state changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/breaking-news-state.json
          git commit -m "Record breaking news E2E test"
          git push
