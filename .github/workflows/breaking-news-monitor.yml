name: Breaking News Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: breaking-news-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check urgent news
        env:
          ALERT_SECRET: ${{ secrets.ALERT_SECRET }}
        run: node scripts/monitor-news.mjs

      - name: Save alert history
        run: |
          if git diff --quiet -- data/breaking-news-state.json; then
            echo "No alert history changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/breaking-news-state.json
          git commit -m "Update breaking news alert history"
          git push
